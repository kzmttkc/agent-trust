name: ci

# 2026-08-05. Vouch had no CI at all — no .github directory, no test script,
# and exactly one test file in the whole repository (the SDK's spend-guard).
# The 1,350-line scoring core, which is the entire product, had none.
#
# That matters more here than in a normal codebase because of what the code
# does when it breaks: the engine is fail-closed, so a regression does not
# throw — it flips every verdict to BLOCK, or (far worse) lets an
# "unavailable" signal through as ALLOW. Both are silent. A customer gating
# x402 settlement on this API would keep settling payments while our RPC was
# down and find out from their losses, not from an error.
#
# No database and no RPC are needed: the suites deliberately test the pure
# modules (verdict / helpers / x402 settlement extraction), which is why those
# functions were moved out of the DB-importing modules in the first place.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (scoring core + SDK)
        run: npm test

  build:
    name: production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The only defect class tsc and the dev server both miss: route
      # conventions, the server/client boundary, and metadata generation.
      - name: Build
        run: npm run build
        env:
          # Build-time only. Nothing here reaches a real database or RPC: the
          # app is written to degrade rather than throw when they are absent,
          # and this job asserts that stays true.
          SKIP_CHAIN_READS: "1"

  # 2026-08-19. The `test` job runs the pure modules with no DB, so 14 suites
  # that need Postgres SKIP there — including the two that guard the highest
  # money-risk in the product: L1 fund-path atomic reservation (the spend is on
  # the ledger BEFORE the signed request goes out) and "two overlapping batches
  # cannot spend past the daily cap" (the $49-against-$25 regression that was
  # found live, not by a test). This job spins an ephemeral Postgres so those
  # run on every push. Serial (--test-concurrency=1) because the suites TRUNCATE
  # shared tables; --test-force-exit so an open pg pool can't hang the runner.
  db-tests:
    name: db-backed integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vet402test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Push schema to the ephemeral test database
        run: npm run db:push -- --force
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/vet402test
      - name: DB-backed integration tests (incl. L1 fund-path concurrency)
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vet402test
