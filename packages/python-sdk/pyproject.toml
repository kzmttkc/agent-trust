[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vet402-sdk"
version = "0.1.0"
description = "Python client for the vet402 Trust API: check a payee before your agent pays, and never pay without an explicit ALLOW."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vet402" }]
keywords = ["x402", "agent", "payments", "trust", "spend-guard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://vet402.com"
Documentation = "https://vet402.com/docs/api"
Source = "https://github.com/kzmttkc/agent-trust"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vet402 = ["py.typed"]
