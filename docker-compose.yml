services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://vouch:vouch_dev@postgres:5432/vouch
      TRUST_PROXY_HEADERS: "true"
    # 本番ビルドを動かすので env ガード（誤ラベルデプロイ防止）が実物の
    # シークレットを要求する。CONTRIBUTING.md のワンライナーで生成する。
    # 弱い既定値をここへ直書きして関門を無意味化しないこと。
    env_file:
      - path: .env.docker
        required: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vouch
      POSTGRES_PASSWORD: vouch_dev
      POSTGRES_DB: vouch
    volumes:
      - vouch_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vouch -d vouch"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  vouch_pg_data:
