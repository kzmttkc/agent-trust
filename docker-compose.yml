services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vouch
      POSTGRES_PASSWORD: vouch_dev
      POSTGRES_DB: vouch
    volumes:
      - vouch_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vouch -d vouch"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  vouch_pg_data:
